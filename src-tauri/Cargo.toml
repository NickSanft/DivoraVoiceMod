[package]
name = "divora-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "DivoraVoice — free real-time voice modulator for Windows"

[lints]
workspace = true

[lib]
name = "divora_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
divora-core = { path = "../divora-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
# v1.9.0: MIDI control surfaces. Windows backend is WinMM (built in, no
# extra system deps); the live port open is desktop-verified like the
# tray/recording paths.
midir = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
# v1.14.0: collect tracing events into a rolling daily log file under
# %APPDATA%/DivoraVoice/logs/ (surfaced via "Open logs folder").
tracing-subscriber = "0.3"
tracing-appender = "0.2"

[features]
custom-protocol = ["tauri/custom-protocol"]
