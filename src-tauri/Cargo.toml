[package]
name = "divora-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "DivoraVoice — free real-time voice modulator for Windows"

[lints]
workspace = true

[lib]
name = "divora_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
divora-core = { path = "../divora-core" }
# v1.52.0: screen recording (Windows Graphics Capture + Media Foundation).
divora-capture = { path = "../divora-capture" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
# v1.9.0: MIDI control surfaces. Windows backend is WinMM (built in, no
# extra system deps); the live port open is desktop-verified like the
# tray/recording paths.
midir = "0.10"
# v1.21.0: on-demand download of the OpenVoice voice-cloning models (kept out
# of the installer to keep it small). Lightweight blocking HTTP client with
# rustls TLS; the download streams to disk in Rust (no 157 MB through IPC).
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# v1.28.0: write saved Speak (TTS) clips to disk as WAV (same crate divora-core
# uses for recordings).
hound = "3"
tracing = "0.1"
# v1.14.0: collect tracing events into a rolling daily log file under
# %APPDATA%/com.divora.voicemod/logs/ (surfaced via "Open logs folder").
tracing-subscriber = "0.3"
tracing-appender = "0.2"
# v1.55.0: charm pictures are named by their content's SHA-256. Already in
# Cargo.lock through tauri-codegen; =0.10.9 adds no package.
sha2 = "=0.10.9"
# v1.61.0: Talk to OBS (D1, D38). Divora's own obs-websocket v5 client in
# src/obs/, on tokio-websockets with no TLS feature: Cargo.lock gains
# tokio-websockets, sha1_smol (BSD-3-Clause) and simdutf8, and nothing else.
# A direct tokio for the link's two tasks on Tauri's runtime: `net` (the
# socket; it also gives that runtime an I/O driver), `time`, `sync`, `rt`.
# No `macros`: the tasks wait with a hand-written `poll_fn` (D6), so
# tokio-macros and syn stay out. Every other crate here is locked already.
tokio = { version = "1", default-features = false, features = ["net", "time", "sync", "rt"] }
tokio-websockets = { version = "=0.13.3", default-features = false, features = ["client", "fastrand", "sha1_smol"] }
futures-core = "0.3"
futures-sink = "0.3"
base64 = "0.22"
zeroize = "1"
fastrand = "2"

[dev-dependencies]
# v1.61.0: the fake obs-websocket server the link's tests run against (§10.2).
tokio-websockets = { version = "=0.13.3", default-features = false, features = ["client", "fastrand", "sha1_smol", "server"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
