[workspace]
resolver = "2"
members = ["src-tauri", "divora-core"]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Divora Contributors"]
repository = "https://github.com/NickSanft/DivoraVoiceMod"
version = "0.0.0"
rust-version = "1.80"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
