<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DivoraVoice — Voice Modulator</title>
<link rel="stylesheet" href="divora/styles.css" />
<link rel="stylesheet" href="divora/components.css" />
</head>
<body>
<div id="stage">
  <div id="frame" class="vignette"></div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="divora/sigils.jsx"></script>
<script type="text/babel" src="divora/components.jsx"></script>
<script type="text/babel" src="divora/data.jsx"></script>
<script type="text/babel" src="divora/spell_circle.jsx"></script>
<script type="text/babel" src="divora/spark_canvas.jsx"></script>
<script type="text/babel" src="divora/screen_mixer.jsx"></script>
<script type="text/babel" src="divora/screen_soundboard.jsx"></script>
<script type="text/babel" src="divora/screen_presets.jsx"></script>
<script type="text/babel" src="divora/screen_settings.jsx"></script>
<script type="text/babel" src="divora/screen_wizard.jsx"></script>
<script type="text/babel" src="divora/tweaks-panel.jsx"></script>
<script type="text/babel" src="divora/tweaks.jsx"></script>
<script type="text/babel" src="divora/app.jsx"></script>
<script type="text/babel">
  // Wait for all babel scripts to transpile, then mount.
  (function wait() {
    if (window.mountDivora && window.MixerScreen && window.SpellCircle) window.mountDivora();
    else setTimeout(wait, 30);
  })();
</script>
</body>
</html>
