name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck, test)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck

      - name: unit tests
        run: pnpm test

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # symphonia-adapter-libopus → opusic-sys vendors libopus and builds
      # it from C source via cmake. windows-2022 ships cmake by default
      # but this guarantees it's on PATH if the image base changes.
      - uses: lukka/get-cmake@latest

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: pnpm build (Tauri macros need dist/)
        run: pnpm build

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        # Tests run serial + with --nocapture so we can see which one
        # owns a crash (parallel + buffered output hides the offender;
        # observed during the v0.9.0 STATUS_ACCESS_VIOLATION debug).
        # Revisit parallelism once the realfft/rubato code path is stable.
        run: cargo test --workspace --all-features -- --test-threads=1 --nocapture

  build:
    name: Tauri debug build
    runs-on: windows-2022
    needs: [rust, frontend]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      # See `rust` job above — libopus → cmake.
      - uses: lukka/get-cmake@latest

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: tauri build (debug, no bundle)
        run: pnpm tauri build --debug --no-bundle
