name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck, test)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck

      - name: unit tests
        run: pnpm test

  e2e:
    name: E2E (Playwright)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # Smoke tests drive the SolidJS frontend in Chromium with the Tauri
      # invoke/event layer mocked (e2e/tauri-mock.ts). Playwright boots the
      # Vite dev server itself (see playwright.config.ts webServer).
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Playwright smoke tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # symphonia-adapter-libopus → opusic-sys vendors libopus and builds
      # it from C source via cmake. windows-2025 ships cmake by default
      # but this guarantees it's on PATH if the image base changes.
      # (windows-2025 = VS 2026 / MSVC v18 since GitHub's June 2026 image
      # repoint; the pinned cmake/cc crates in Cargo.lock support it.)
      - uses: lukka/get-cmake@latest

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: pnpm build (Tauri macros need dist/)
        run: pnpm build

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        # The `CI=true` env var is checked by audio-device tests to
        # skip cpal/WASAPI enumeration on the headless windows-2025
        # runner — those calls intermittently STATUS_ACCESS_VIOLATION
        # under parallel test execution (real hardware is fine).
        env:
          CI: "true"
        run: cargo test --workspace --all-features

  build:
    name: Tauri debug build
    runs-on: windows-2025
    needs: [rust, frontend]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      # See `rust` job above — libopus → cmake.
      - uses: lukka/get-cmake@latest

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: tauri build (debug, no bundle)
        run: pnpm tauri build --debug --no-bundle
