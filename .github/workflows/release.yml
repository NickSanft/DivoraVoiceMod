name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      # symphonia-adapter-libopus → opusic-sys builds libopus from C
      # source via cmake. windows-2022 ships cmake, but this pins it.
      - uses: lukka/get-cmake@latest

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # Phase 12.4: fetch the voice-conversion binaries (onnxruntime.dll
      # + the LLVC model) from the `voice-assets-v1` release into
      # src-tauri/resources/. They're not in git (binaries); the
      # bundle-overlay config references them so the installer ships
      # voice conversion working out of the box. The base config has no
      # `resources`, so normal CI (ci.yml) never needs this fetch.
      - name: Fetch voice-conversion assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-voice-assets.ps1

      - name: tauri build (release, with bundled voice assets)
        run: pnpm tauri build --config src-tauri/tauri.bundle.conf.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
