name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      # symphonia-adapter-libopus → opusic-sys builds libopus from C
      # source via cmake. windows-2025 ships cmake, but this pins it.
      - uses: lukka/get-cmake@latest

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # Phase 12.4: fetch the voice-conversion binaries (onnxruntime.dll
      # + the LLVC model) from the `voice-assets-v1` release into
      # src-tauri/resources/. They're not in git (binaries); the
      # bundle-overlay config references them so the installer ships
      # voice conversion working out of the box. The base config has no
      # `resources`, so normal CI (ci.yml) never needs this fetch.
      - name: Fetch voice-conversion assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-voice-assets.ps1

      # Phase 12.5: stamp the tag's version into the build so the
      # installer is named DivoraVoice_<ver>_... instead of 0.0.0, and
      # the exe reports the real version. The committed files stay at
      # 0.0.0 (git tags are the version source of truth) — this only
      # edits the ephemeral CI checkout.
      - name: Stamp version from tag
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if ($ver -notmatch '^\d+\.\d+\.\d+$') { throw "tag '$ver' is not semver" }
          $tj = "src-tauri/tauri.conf.json"
          (Get-Content $tj -Raw) -replace '"version": "0\.0\.0"', ('"version": "' + $ver + '"') |
            Set-Content $tj -NoNewline -Encoding utf8
          $ct = "Cargo.toml"
          (Get-Content $ct -Raw) -replace 'version = "0\.0\.0"', ('version = "' + $ver + '"') |
            Set-Content $ct -NoNewline -Encoding utf8
          Write-Host "Stamped version $ver into tauri.conf.json + Cargo.toml"

      - name: tauri build (release, with bundled voice assets)
        run: pnpm tauri build --config src-tauri/tauri.bundle.conf.json

      # Publish SHA-256 checksums so a download can be verified. Writes a
      # coreutils-format SHA256SUMS.txt (attached as a release asset, so
      # `sha256sum -c SHA256SUMS.txt` works) and a RELEASE_BODY.md block that
      # the release notes prepend to the auto-generated changelog.
      - name: Compute SHA-256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path target/release/bundle/msi/*.msi, target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue
          if (-not $files) { throw "no installer artifacts found to checksum" }
          # Two-space separator = coreutils text-mode format (`sha256sum -c`).
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            '{0}  {1}' -f $h, $f.Name
          }
          # LF-only, no trailing CRLF: coreutils `sha256sum -c` treats a
          # trailing \r as part of the filename and fails the check, so a
          # plain `$lines | Set-Content` (CRLF on Windows) would break the
          # very command the release notes tell people to run.
          (($lines -join "`n") + "`n") | Set-Content -Path SHA256SUMS.txt -NoNewline -Encoding ascii
          $body = @()
          $body += '## SHA-256 checksums'
          $body += ''
          $body += 'Verify a download with `Get-FileHash <file> -Algorithm SHA256` (PowerShell) or `sha256sum -c SHA256SUMS.txt`.'
          $body += ''
          $body += '```'
          $body += $lines
          $body += '```'
          ($body -join "`n") | Set-Content -Path RELEASE_BODY.md -Encoding utf8
          Write-Host "Checksums:"
          $lines | ForEach-Object { Write-Host "  $_" }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_BODY.md
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            SHA256SUMS.txt
