[package]
name = "divora-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Audio engine and DSP primitives for Divora"

[lints]
workspace = true

[dependencies]
biquad = "0.5"
cpal = "0.15"
# Phase 16: WAV encoding for recording the modulated output. Tiny,
# pure-Rust, no transitive deps — the de-facto Rust WAV crate.
hound = "3"
# Phase 10: RNNoise-based noise suppression. `nnnoiseless` is a pure-
# Rust port of Xiph's RNNoise; default features pull in CLI deps
# (anyhow, clap, hound) we don't need, so disable them.
nnnoiseless = { version = "0.5", default-features = false }
# Phase 12: ONNX Runtime via the `ort` crate for AI voice conversion
# (LLVC). `load-dynamic` defers the runtime DLL load to first use,
# so the build doesn't depend on a system install or build-time
# download. Users (or our installer) drop `onnxruntime.dll` next to
# the binary or set `ORT_DYLIB_PATH`; missing-DLL degrades the
# voice effect to a passthrough at runtime.
#
# `api-24` matches the api-version constants the rc.12 code path
# expects — without it, ort's vitis EP module fails to compile
# against the load-dynamic OrtApi struct. Pin exactly to rc.12 so
# a registry refresh doesn't drift onto a newer rc with different
# API surface.
#
# Missing model files at `%APPDATA%/DivoraVoice/voices/<name>.onnx`
# also degrade to passthrough — the effect compiles and runs
# without any ONNX assets on disk.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["load-dynamic", "ndarray", "std", "api-24"] }
# Tensor types ort hands us; the version is dictated by ort's own
# tensor backing.
ndarray = "0.17"
ringbuf = "0.4"
# Phase 9: phase-vocoder pitch + formant shifting via STFT.
realfft = "3"
# Phase 9: rate matching when input + output devices disagree.
# `SincFixedOut` gives us fixed output chunks (one per device callback)
# with variable input — exactly the realtime shape we need.
rubato = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6", features = ["wav", "mp3", "vorbis", "ogg", "flac", "pcm"] }
# OGG-Opus support (Discord recordings). The `bundled` default feature
# vendors libopus and builds it as part of the crate's build script, so
# we don't depend on a system libopus install on Windows CI.
symphonia-adapter-libopus = "0.3"
thiserror = "1"
# Phase C (accent cloning): load VoxCPM's Llama BPE tokenizer from its
# `tokenizer.json`. Default features pull in onig (a C oniguruma build) plus a
# training/HTTP stack we don't need; use the pure-Rust `fancy-regex` backend so
# the build stays toolchain-free (this tokenizer is plain BPE + a Prepend/
# Replace normalizer, no regex pre-tokenizer, so it's a lean load-only use).
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
tracing = "0.1"
walkdir = "2"

[dev-dependencies]
